name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: code/frontend
        run: flutter pub get

      - name: Analyze
        working-directory: code/frontend
        run: flutter analyze

      - name: Test
        working-directory: code/frontend
        run: flutter test

      - name: Build web
        working-directory: code/frontend
        # --no-web-resources-cdn bundles CanvasKit locally instead of pulling it
        # from gstatic, so the app loads without third-party network access —
        # the POC is meant to work offline.
        # base-href matches the repository name, since project Pages sites are
        # served from /<repo>/ rather than the domain root.
        run: |
          flutter build web \
            --release \
            --no-web-resources-cdn \
            --base-href "/${{ github.event.repository.name }}/"

      - name: Stage the built app
        run: cp -R code/frontend/build/web _site

      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
