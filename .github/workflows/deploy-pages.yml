name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  build:
    name: Build site
    # A named release rather than ubuntu-latest, so the image changing under
    # the build is a commit here and not a surprise.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: code/frontend
        run: flutter pub get

      - name: Analyze
        working-directory: code/frontend
        run: flutter analyze

      - name: Test
        working-directory: code/frontend
        run: flutter test

      - name: Build web
        working-directory: code/frontend
        # --no-web-resources-cdn bundles CanvasKit locally instead of pulling it
        # from gstatic, so the app loads without third-party network access —
        # the POC is meant to work offline.
        # base-href matches the repository name, since project Pages sites are
        # served from /<repo>/ rather than the domain root.
        # AI_ENDPOINT is a repository variable (Settings → Secrets and
        # variables → Actions → Variables): the Cloudflare Worker's address,
        # ending /v1. Not a secret; unset, the site has no AI.
        run: |
          flutter build web \
            --release \
            --no-web-resources-cdn \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=AI_ENDPOINT="${{ vars.AI_ENDPOINT }}"

      # The suite tests widgets; nothing above has loaded the site in a
      # browser. This does, the way a visitor would: it waits for the first
      # frame, visits every destination and opens a job, and fails on a page
      # error, a console error, a failed request for one of the site's own
      # files, or a control it cannot find.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the browser
        working-directory: code/frontend
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Smoke test the built site
        working-directory: code/frontend
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p /tmp/serve
          cp -R build/web "/tmp/serve/$REPO"
          python3 -m http.server 8099 --directory /tmp/serve &
          for i in $(seq 1 20); do
            curl -sf "http://localhost:8099/$REPO/" > /dev/null && break
            sleep 1
          done
          node tool/look_web.js --smoke \
            --url "http://localhost:8099/$REPO/" \
            --out smoke

      - name: Keep the smoke test's screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: code/frontend/smoke

      - name: Stage the built app
        run: cp -R code/frontend/build/web _site

      # The canonical URL is only knowable here: the app is built from a repo
      # that could be forked or renamed, and a canonical pointing at the wrong
      # origin is worse than none at all.
      - name: Add the canonical URL
        env:
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python3 - "$PAGE_URL" <<'EOF'
          import pathlib, sys

          url = sys.argv[1].lower()
          page = pathlib.Path('_site/index.html')
          html = page.read_text()
          tag = f'  <link rel="canonical" href="{url}">\n'

          page.write_text(html.replace('</head>', tag + '</head>', 1))
          print(f'canonical: {url}')
          EOF

      - name: Disable Jekyll processing
        run: touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
