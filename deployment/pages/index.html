<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trust-Hire</title>
    <meta name="description" content="Trust-Hire — proof of concept." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #16181d;
        --muted: #5c6370;
        --line: #e3e6ea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --fg: #eceef2;
          --muted: #9aa2ae;
          --line: #2a2e35;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
      }
      main { max-width: 34rem; }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 6vw, 2.75rem);
        letter-spacing: -0.02em;
      }
      p { margin: 0 0 1rem; color: var(--muted); }
      .tag {
        display: inline-block;
        margin-bottom: 1.25rem;
        padding: 0.2rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      footer {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        font-size: 0.875rem;
        color: var(--muted);
      }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">Proof of concept</span>
      <h1>Trust-Hire</h1>
      <p>
        This is a placeholder page. It is published automatically from
        <code>deployment/pages/</code> until a frontend exists at
        <code>code/frontend/</code>, at which point the deployment workflow
        publishes the frontend build instead.
      </p>
      <footer>
        Deployed from <code>main</code> by
        <code>.github/workflows/deploy-pages.yml</code>.
      </footer>
    </main>
  </body>
</html>
