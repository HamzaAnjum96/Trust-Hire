# Trust Hire's AI Worker. Deploy with `npx wrangler deploy` from this folder,
# with CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the environment: the
# account and the token never go in this file or anywhere in the repository.
name = "trust-hire-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Workers AI, authorised by the account the Worker runs in. No key needed.
[ai]
binding = "AI"

[vars]
# The free tier allows 10,000 neurons a day; an 8B model answers several
# hundred requests on that, a 70B one about a hundred. Change it here.
MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
# The site, and a local web build for looking at it. Comma-separated.
ALLOWED_ORIGINS = "https://hamzaanjum96.github.io,http://localhost:8099"

# A few requests a minute per address, so one visitor cannot spend the day.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
